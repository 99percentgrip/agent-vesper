[package]
name = "rust-sse-transport-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
httpdate = "=1.0.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
serde_json = "=1.0.145"
tokio = { version = "=1.52.0", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.17" }
