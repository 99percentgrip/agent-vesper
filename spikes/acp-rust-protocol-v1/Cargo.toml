[package]
name = "acp-rust-protocol-v1-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Standalone workspace root: this disposable spike is excluded from the
# production workspace (root Cargo.toml `exclude = ["spikes/*"]`). Declaring
# an empty workspace here prevents cargo from walking up and erroring on the
# exclusion when invoked via `--manifest-path`.
[workspace]

[dependencies]
agent-client-protocol = { version = "=2.0.0", features = ["unstable_session_fork"] }
futures = "=0.3.32"
serde_json = "=1.0.145"
tokio = { version = "=1.52.0", default-features = false, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio-util = { version = "=0.7.17", features = ["compat"] }
