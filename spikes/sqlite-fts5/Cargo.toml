[package]
name = "sqlite-fts5-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Standalone workspace root: this disposable spike is excluded from the
# production workspace (root Cargo.toml `exclude = ["spikes/*"]`). Declaring
# an empty workspace here prevents cargo from walking up and erroring on the
# exclusion when invoked via `--manifest-path`.
[workspace]

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]
system-sqlite = ["rusqlite/libsqlite3-sys"]

[dependencies]
rusqlite = { version = "=0.40.1", default-features = false }

[dev-dependencies]
tempfile = "=3.23.0"
