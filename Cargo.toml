[workspace]
members = [
    "apps/agent-vesper-acp",
    "apps/agent-vesper-tui",
    "crates/vesper-config",
    "crates/vesper-acp",
    "crates/vesper-agent",
    "crates/vesper-domain",
    "crates/vesper-policy",
    "crates/vesper-provider",
    "crates/vesper-provider-glm",
    "crates/vesper-provider-synthetic",
    "crates/vesper-runtime",
    "crates/vesper-sessions",
    "crates/vesper-security",
    "crates/vesper-testkit",
    "xtask",
]
exclude = ["spikes/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Aleksejs Kozlitins"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
agent-client-protocol = { version = "=2.0.0", default-features = false, features = ["unstable_auth_methods", "unstable_session_fork"] }
clap = { version = "=4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
futures-core = { version = "=0.3.33", default-features = false, features = ["std"] }
futures-util = { version = "=0.3.33", default-features = false, features = ["std"] }
httpdate = { version = "=1.0.3" }
jsonschema = { version = "=0.49.2", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.11.0", default-features = false }
thiserror = { version = "=2.0.19" }
tokio = { version = "=1.52.0", default-features = false, features = ["io-std", "macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.17", default-features = false, features = ["compat", "rt"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.22", default-features = false, features = ["ansi", "env-filter", "fmt", "smallvec", "tracing-log"] }
url = { version = "=2.5.8", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_dependencies = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.metadata.agent-vesper]
msrv = "1.88.0"
source-commit = "bf4d4287e2e3320aa3f09015f678e6169d520045"
fixture-schema = 1
persistence-stage = 6
session-writes-enabled = true
sqlite-enabled = false
