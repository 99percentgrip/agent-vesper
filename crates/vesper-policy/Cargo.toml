[package]
name = "vesper-policy"
description = "Pure permission and policy decision contracts for Agent Vesper"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Override the workspace `regex` pin (default-features = false, features =
# ["std"]) to add `unicode-perl`: firewall rules use \w/\s/\b classes and the
# std-only build rejects them. Mirrors the local override in vesper-agent
# and vesper-cognition; does not leak to other crates.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde.workspace = true
vesper-domain = { path = "../vesper-domain", version = "=0.20.82" }
vesper-security = { path = "../vesper-security", version = "=0.20.82" }

[lints]
workspace = true
