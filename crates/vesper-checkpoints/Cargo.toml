[package]
name = "vesper-checkpoints"
description = "Workspace snapshot, rollback, session lineage, and bounded cron/export/clipboard/CI surface for Agent Vesper (ADR 0012 — Stage 14). JSONL-only, RAII-safe, no SQLite, no git refs."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
vesper-domain = { path = "../vesper-domain", version = "=0.20.53" }
vesper-security = { path = "../vesper-security", version = "=0.20.53" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
