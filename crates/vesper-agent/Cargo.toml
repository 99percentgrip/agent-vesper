[package]
name = "vesper-agent"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util.workspace = true
glob.workspace = true
# VRO-7 (Verified Workflow Learning) — SecretScrubber uses \b/\s/\w word
# boundaries for secret-shape detection. The workspace pins regex with
# default-features=false (ASCII-only) to keep foundational crates lean; we
# override per-crate to enable unicode-perl so the scrubber patterns compile.
# This does NOT leak to other crates — they keep using `regex.workspace`.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# ADR 0017 (VRO-11): VesperLens needs raw TCP I/O for the loopback HTTP
# oracle. We enable the `net` and `io-util` features additively on top of
# the workspace tokio pin; no other crate is affected.
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
uuid.workspace = true
vesper-domain = { path = "../vesper-domain", version = "=0.20.53" }
vesper-provider = { path = "../vesper-provider", version = "=0.20.53" }
vesper-runtime = { path = "../vesper-runtime", version = "=0.20.53" }

[dev-dependencies]
# VRO-9 (Directive 3): live HTTP integration tests for the ReAct loop drive
# a real local LM Studio endpoint at localhost:1234. The crate's production
# source tree (src/) never references reqwest (architecture scan enforced);
# the dev-only test binary is the sole consumer.
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
vesper-testkit = { path = "../vesper-testkit", version = "=0.20.53" }

[lints]
workspace = true
