[package]
name = "vesper-harness"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
regex.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
vesper-agent = { path = "../vesper-agent", version = "=0.20.80" }
vesper-checkpoints = { path = "../vesper-checkpoints", version = "=0.20.80" }
vesper-config = { path = "../vesper-config", version = "=0.20.80" }
vesper-domain = { path = "../vesper-domain", version = "=0.20.80" }
vesper-mcp = { path = "../vesper-mcp", version = "=0.20.80" }
vesper-memory = { path = "../vesper-memory", version = "=0.20.80" }
vesper-runtime = { path = "../vesper-runtime", version = "=0.20.80" }
vesper-sandbox = { path = "../vesper-sandbox", version = "=0.20.80" }
vesper-sessions = { path = "../vesper-sessions", version = "=0.20.80" }

[features]
# VRO-13 PR-6: the daemon's single-writer flock discipline. Unix-only

# Forwards to vesper-sandbox's docker backend so hosts can enable it
docker = ["vesper-sandbox/docker"]

[dev-dependencies]
tempfile.workspace = true
# VRO-13 PR-8: the cross-feature e2e fixture composes the firewall holder
# (vesper-policy), the provider seam (vesper-provider), and the deterministic
# fake provider (vesper-testkit) — test-only, mirroring vesper-agent/tests.
vesper-policy = { path = "../vesper-policy", version = "=0.20.80" }
vesper-provider = { path = "../vesper-provider", version = "=0.20.80" }
vesper-testkit = { path = "../vesper-testkit", version = "=0.20.80" }

[lints]
workspace = true
