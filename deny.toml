[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "rusqlite", reason = "Stage 5 session persistence is read-only and explicitly excludes SQLite" },
    { crate = "sqlx", reason = "Stage 5 session persistence is read-only and explicitly excludes SQLite" },
    { crate = "libsqlite3-sys", reason = "Stage 5 must not acquire SQLite transitively" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
