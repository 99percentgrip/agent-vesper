name: web-driver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Contained browser ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-24.04
          - arch: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build immutable browser and helper image
        run: docker build -f crates/vesper-web-fetch/Dockerfile -t vesper-web-driver:validated .
      - name: Real pipe-browser acceptance
        run: |
          export VESPER_WEB_TEST_IMAGE="$(docker image inspect vesper-web-driver:validated --format '{{.Id}}')"
          cargo test -p vesper-web-fetch --all-features real_pipe_browser -- --ignored --nocapture
      - name: Real scoped Hive lifecycle acceptance
        timeout-minutes: 15
        run: |
          export VESPER_DOCKER_IMAGE="$(docker image inspect vesper-web-driver:validated --format '{{.Id}}')"
          cargo test -p vesper-harness --all-features --test swarm_native_hive native_container_hive -- --ignored --nocapture
          cargo test -p vesper-harness --all-features --test swarm_native_hive native_shared_service -- --ignored --nocapture
          cargo test -p agent-vesper-acp --all-features --test swarm_native_process -- --ignored --nocapture
          cargo test -p vesper-harness --all-features --lib native_shared_scope -- --ignored --nocapture
          cargo test -p vesper-harness --all-features --test swarm_native_hive native_shared_scope_hive -- --ignored --nocapture
          cargo test -p agent-vesper-tui --all-features --bin agent-vesper-tui native_tui_swarm -- --ignored --nocapture
      - name: Native browser feedback continuation
        timeout-minutes: 8
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/vesper-browser-test" --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/vesper-browser-test/node_modules/.bin/playwright" install --with-deps chromium
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/vesper-browser-test/node_modules/playwright"
          export CHROME_PATH="$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          cargo test -p vesper-harness --features swarm --test swarm_adapter_tests real_browser_feedback -- --ignored --nocapture
      - name: Preserve exact tested image for release
        shell: bash
        run: |
          mkdir -p driver-assets
          docker image inspect vesper-web-driver:validated --format '{{.Id}}' > driver-assets/vesper-web-driver-${{ matrix.arch }}.image-id
          docker save vesper-web-driver:validated | gzip -1 > driver-assets/vesper-web-driver-${{ matrix.arch }}.tar.gz
          cd driver-assets
          sha256sum vesper-web-driver-${{ matrix.arch }}.tar.gz > vesper-web-driver-${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-driver-${{ matrix.arch }}
          path: driver-assets
          compression-level: 0
          if-no-files-found: error

  namespace:
    name: Native namespace Hive
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build real namespace supervisor
        run: cargo build --locked -p vesper-sandbox --bin sandbox_init
      - name: Compile namespace acceptance fixture
        run: cargo test --locked -p vesper-harness --features swarm --test swarm_native_hive --no-run
      - name: Real namespace permission and cleanup acceptance
        timeout-minutes: 5
        env:
          VESPER_SANDBOX_INIT: ${{ github.workspace }}/target/debug/sandbox_init
        run: |
          "$VESPER_SANDBOX_INIT" probe
          cargo test --locked -p vesper-sandbox --test namespaces namespace_security_and_timeout_acceptance -- --ignored --nocapture
          cargo test --locked -p vesper-harness --features swarm --test swarm_native_hive native_scoped_hive -- --ignored --nocapture
