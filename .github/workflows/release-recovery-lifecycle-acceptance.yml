name: rrc-host-lifecycle-acceptance
run-name: rrc-host-lifecycle-${{ inputs.candidate_ref }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact candidate commit SHA in this private acceptance repository
        required: true
        type: string

permissions:
  contents: read

jobs:
  lifecycle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-intel
            runner: macos-15-intel
          - target: macos-apple-silicon
            runner: macos-15
          - target: windows-x86_64
            runner: windows-2025
    steps:
      - name: Reject non-SHA candidate input
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          if ! printf '%s' "${CANDIDATE_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'candidate_ref must be an exact lowercase 40-character commit SHA' >&2
            exit 2
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run native RRC cancellation and restart lifecycle
        shell: bash
        run: cargo test -p vesper-harness release_executor::tests::release_worker_cancel_restart_process_acceptance -- --exact --test-threads=1 --nocapture
