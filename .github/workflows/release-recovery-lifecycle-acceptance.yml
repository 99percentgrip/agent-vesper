name: xai-sse-focused-native-acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
jobs:
  boundary:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e425b5b5e9670e05221b7a09e633d1c12122f486
      - name: Verify exact correction source
        shell: bash
        run: test "$(git rev-parse HEAD)" = e425b5b5e9670e05221b7a09e633d1c12122f486
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Run HTTP boundary suite
        shell: bash
        run: cargo test --locked -p vesper-provider-xai --lib --all-features tests::http:: -- --test-threads=1 --nocapture
      - name: Repeat oversized rejection and fragmented UTF-8
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 10); do
            echo "Native boundary repetition ${iteration}"
            cargo test --locked -p vesper-provider-xai --lib --all-features tests::http::oversized_sse_event_settles_as_protocol_error -- --exact --nocapture
            cargo test --locked -p vesper-provider-xai --lib --all-features tests::http::fragmented_utf8_sse_settles_once -- --exact --nocapture
          done
