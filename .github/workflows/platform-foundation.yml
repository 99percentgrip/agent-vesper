name: five-target-foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Use sccache for the entire workflow so every `rustc` invocation (build,
# test, clippy, doc, xtask) hits the shared GitHub Actions cache backend.
# `SCCACHE_GHA_ENABLED=true` makes sccache persist to the GHA cache, which
# is content-addressed and far more effective than caching the entire
# `target/` directory as a tarball (the old `swatinem/rust-cache` model).
#
# `RUSTC_WRAPPER` is intentionally NOT set at the workflow level. sccache
# hard-depends on the GHA cache backend, which can suffer transient
# outages ("Our services aren't available right now"). Each cargo step
# reads `steps.sccache_check.outputs.sccache_ready` and only sets
# `RUSTC_WRAPPER=sccache` when the daemon verified healthy, so an outage
# degrades gracefully to direct compilation instead of failing every job.
#
# `CARGO_INCREMENTAL=0` and the lighter `dev`/`test` debug levels are the
# two biggest levers for shrinking target/debug on CI. The default dev
# profile (`debug=true`, `incremental=true`) produces ~17 GB of
# incremental/ artifacts plus ~21 GB of full-symbol deps on a workspace
# this size — 38-40 GB written to disk per run, dominating the Windows
# job's wall-clock time. Disabling incremental and using line-tables-only
# (still useful backtraces, no inlined debuginfo) cuts target/debug to
# roughly 1/4 with no test coverage loss. Local development is unaffected
# — these are CI-only env overrides, not workspace profile changes.
env:
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  foundation:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            platform_spike: linux
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform_spike: linux
          - target: macos-intel
            runner: macos-15-intel
            platform_spike: macos
          - target: macos-apple-silicon
            runner: macos-15
            platform_spike: macos
          - target: windows-x86_64
            runner: windows-2025
            platform_spike: windows
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.7
      - name: Verify sccache health
        id: sccache_check
        shell: bash
        run: |
          set +e
          # Force the sccache daemon to start by asking it to wrap rustc on a
          # trivially valid empty library crate. If the GHA cache backend is
          # down, sccache refuses to start at all and we fall back to direct
          # compilation for the rest of the job.
          printf '' > sccache_probe.rs
          sccache rustc --crate-type lib --edition 2024 --emit metadata sccache_probe.rs >/dev/null 2>&1
          status=$?
          rm -f sccache_probe.rs
          if [ ${status} -eq 0 ]; then
            echo "sccache_ready=true" >> "$GITHUB_OUTPUT"
            echo "sccache is healthy; cached compilation enabled."
          else
            echo "sccache_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::sccache unavailable (status ${status}); falling back to direct compilation."
          fi
      - name: Run eligible foundational tests
        shell: bash
        env:
          RUSTC_WRAPPER: ${{ steps.sccache_check.outputs.sccache_ready == 'true' && 'sccache' || '' }}
        run: cargo test --workspace --all-features
      - name: Validate fixtures and architecture
        shell: bash
        env:
          RUSTC_WRAPPER: ${{ steps.sccache_check.outputs.sccache_ready == 'true' && 'sccache' || '' }}
        run: |
          cargo xtask fixtures validate
          cargo xtask fixtures verify-index
          cargo xtask fixtures coverage --stage 2
          cargo xtask fixtures coverage --stage 3
          cargo xtask fixtures coverage --stage 4
          cargo xtask fixtures coverage --stage 5
          cargo xtask contracts verify
          cargo xtask provider glm verify
          cargo xtask runtime verify
          cargo xtask acp verify
          cargo xtask sessions verify
          cargo xtask architecture
      - name: Run Stage 4.1 process transcript blockers
        shell: bash
        timeout-minutes: 12
        env:
          RUSTC_WRAPPER: ${{ steps.sccache_check.outputs.sccache_ready == 'true' && 'sccache' || '' }}
        run: cargo test -p agent-vesper-acp --all-features --test process_blockers -- --test-threads=1
      - name: Run process conformance tests
        shell: bash
        env:
          RUSTC_WRAPPER: ${{ steps.sccache_check.outputs.sccache_ready == 'true' && 'sccache' || '' }}
        run: cargo test --manifest-path spikes/process-sandbox/Cargo.toml --test process_conformance
      - name: Run Linux sandbox conformance
        if: matrix.platform_spike == 'linux'
        shell: bash
        env:
          RUSTC_WRAPPER: ${{ steps.sccache_check.outputs.sccache_ready == 'true' && 'sccache' || '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          cargo test --manifest-path spikes/process-sandbox/Cargo.toml --test linux_bwrap
      - name: Run macOS prepared conformance
        if: matrix.platform_spike == 'macos'
        shell: bash
        run: bash spikes/process-sandbox/scripts/macos-conformance.sh
      - name: Run Windows prepared conformance
        if: matrix.platform_spike == 'windows'
        shell: pwsh
        run: ./spikes/process-sandbox/scripts/windows-conformance.ps1
