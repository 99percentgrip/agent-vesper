name: pull-request-validation

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'docs/**/*.md'
      - 'docs/foundation/*-evidence.json'
      - 'docs/foundation/*-source.json'
      - 'docs/foundation/*-requirements.json'
      - 'docs/foundation/*-document-verification.json'
      - 'docs/foundation/*-receipts.tar.gz'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'docs/**/*.md'
      - 'docs/foundation/*-evidence.json'
      - 'docs/foundation/*-source.json'
      - 'docs/foundation/*-requirements.json'
      - 'docs/foundation/*-document-verification.json'
      - 'docs/foundation/*-receipts.tar.gz'

permissions:
  contents: read

# Bound native debug artifacts without reducing test coverage.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Prepare native Rust storage
        run: sh .github/prepare-rust-runner.sh
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Verify release prerequisite policy
        run: python3 scripts/test_release_gate.py
      - name: Verify workspace
        run: cargo xtask verify
      - name: Completion assurance mutation gate
        run: cargo xtask acceptance-mutations
      - name: Verify installer user-state preservation
        run: sh scripts/test_install_upgrade.sh
      - name: Verify native voice lifecycle without a microphone
        timeout-minutes: 6
        run: |
          cargo build -p agent-vesper-tui --all-features
          python3 -m venv "$RUNNER_TEMP/voice-test-python"
          "$RUNNER_TEMP/voice-test-python/bin/pip" install --only-binary=:all: numpy==2.5.3
          "$RUNNER_TEMP/voice-test-python/bin/python" apps/agent-vesper-tui/tests/voice_chunks.py
          python3 apps/agent-vesper-tui/tests/voice_pty.py target/debug/agent-vesper-tui "$RUNNER_TEMP/voice-test-python/bin/python"
          python3 apps/agent-vesper-tui/tests/xai_usage_pty.py target/debug/agent-vesper-tui
      - name: Verify native release control parity
        timeout-minutes: 5
        run: |
          cargo build -p agent-vesper-acp -p agent-vesper-tui --all-features --locked
          python3 apps/agent-vesper-tui/tests/release_hosts_pty.py target/debug/agent-vesper-tui target/debug/agent-vesper-acp
      - name: Verify documentation structure
        run: |
          sh -n scripts/install.sh scripts/uninstall.sh
          test -f docs/architecture.md
          test -f docs/workspace-map.md
          test -f docs/dependencies.md
          test -f docs/migration-status.md
          test -f docs/stage2/contract-completion-report.md
          test -f docs/stage2/stage3-readiness.md
          test -f docs/stage3/glm-adapter-report.md
          test -f docs/stage3/stage4-readiness.md
          test -f docs/stage4/acp-adapter-report.md
          test -f docs/stage4/stage5-readiness.md
          test -f docs/stage5/session-store-report.md
          test -f docs/stage5/stage6-readiness.md
          test "$(find docs/adr -maxdepth 1 -name '*.md' | wc -l)" -ge 8
      - name: Record native build storage
        if: always()
        run: |
          df -h / "$GITHUB_WORKSPACE"
          du -sh target || true

  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Offline install regression (Windows PowerShell 5.1 Desktop)
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\test_install_windows.ps1
      - name: Offline install regression (PowerShell 7+)
        shell: cmd
        run: pwsh.exe -NoProfile -File scripts\test_install_windows.ps1

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install pinned policy tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      - name: Audit advisories
        run: cargo audit
      - name: Enforce licenses, sources, bans, and advisories
        run: cargo deny --all-features check
